<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" role="img" aria-label="Talent 360 logo">
  <defs>
    <linearGradient id="ribbonMain" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="35%" stop-color="#14b8a6"/>
      <stop offset="65%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="ribbonHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f766e" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Infinity ribbon base — thick stroke forming the figure-8 -->
  <path d="M 18 40 C 18 12, 62 12, 92 40 C 122 68, 178 68, 208 40 C 238 12, 282 12, 302 40 C 302 68, 258 68, 228 40 C 198 12, 142 12, 112 40 C 82 68, 18 68, 18 40 Z"
        fill="none" stroke="url(#ribbonMain)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" filter="url(#softShadow)" opacity="0.98"/>
  <!-- Top highlight for 3D -->
  <path d="M 18 40 C 18 12, 62 12, 92 40 C 122 68, 178 68, 208 40 C 238 12, 282 12, 302 40"
        fill="none" stroke="url(#ribbonHighlight)" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
  <!-- Bar chart inside left loop -->
  <g filter="url(#softShadow)">
    <rect x="36" y="52" width="13" height="16" rx="2" fill="url(#barGrad)" opacity="0.95"/>
    <rect x="54" y="38" width="13" height="30" rx="2" fill="url(#barGrad)" opacity="0.98"/>
    <rect x="72" y="22" width="13" height="46" rx="2" fill="url(#barGrad)"/>
  </g>
</svg>
