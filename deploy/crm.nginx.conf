# /etc/nginx/sites-available/crm  →  symlink into sites-enabled
#
# Replace crm.example.com throughout, then let certbot fill in the certificate
# lines: `certbot --nginx -d crm.example.com`.

server {
    listen 80;
    listen [::]:80;
    server_name crm.example.com;

    # certbot's ACME challenge is the only reason port 80 is open at all.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name crm.example.com;

    ssl_certificate     /etc/letsencrypt/live/crm.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.example.com/privkey.pem;

    # 32MB is the app's OWN body limit, for template and document upload. A
    # smaller value here breaks upload with nginx's 413 instead of the app's own
    # message, and the error does not point at this file.
    client_max_body_size 32m;

    # Generated documents are a couple of megabytes each and a "download all"
    # fires several in a row. The default 60s is fine on a good connection and
    # not on a phone.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:5180;

        # Host MUST be preserved. The CSRF defence compares the request's Origin
        # against its Host, so a proxy that rewrites Host to 127.0.0.1 makes
        # EVERY write fail with "Cross-origin request refused" — and the error
        # will not point you here. This is the single most common way to break
        # this deployment.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
    }
}
