<style>
  :root {
    --ink: #0B2545;
    --accent: #12886F;
    --accent-dark: #0E6F5A;
    --bg: #FAFAF8;
    --panel: #FFFFFF;
    --line: #E1E4E8;
    --text: #33404D;
    --text-dim: #6B7785;
    --danger: #B3261E;
    --danger-bg: #FDEDEC;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg); color: var(--text); margin: 0; padding: 20px;
    font-size: 13.5px; line-height: 1.5;
  }
  h1, h2, h3 { color: var(--ink); margin: 0 0 4px; font-weight: 600; }
  h1 { font-size: 17px; }
  h2 { font-size: 14px; }
  p.dek { color: var(--text-dim); margin: 0 0 18px; font-size: 12.5px; }

  label { display: block; font-size: 12px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
  input[type=text], input[type=number], input[type=date], select, textarea {
    width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px;
    font-size: 13px; font-family: inherit; background: var(--panel); color: var(--text);
  }
  textarea { resize: vertical; min-height: 56px; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  .field { margin-bottom: 14px; }
  .field .required-mark { color: var(--danger); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 9px 16px; border-radius: 6px; border: 1px solid transparent;
    font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-secondary { background: var(--panel); color: var(--ink); border-color: var(--line); }
  .btn-secondary:hover { background: #F1F1EE; }
  .btn:disabled { opacity: 0.55; cursor: default; }
  .btn-row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  .btn-row.split { justify-content: space-between; }

  .error-box {
    background: var(--danger-bg); border: 1px solid rgba(179,38,30,0.25); color: var(--danger);
    border-radius: 6px; padding: 10px 12px; font-size: 12.5px; margin-bottom: 14px; white-space: pre-line;
  }
  .hint { color: var(--text-dim); font-size: 11.5px; margin-top: 3px; }

  .spinner {
    display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: -2px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .step-list { display: flex; gap: 6px; margin-bottom: 18px; }
  .step-dot { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
  .step-dot.active { background: var(--accent); }
  .step-dot.done { background: var(--ink); }

  .doctype-choice {
    display: block; width: 100%; text-align: left; padding: 14px 16px; margin-bottom: 10px;
    border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel);
    cursor: pointer; font-family: inherit;
  }
  .doctype-choice:hover { border-color: var(--accent); background: #F4FBF9; }
  .doctype-choice .title { font-weight: 600; color: var(--ink); font-size: 14px; }
  .doctype-choice .sub { color: var(--text-dim); font-size: 12px; margin-top: 2px; }

  .service-row {
    display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line);
    font-size: 13px;
  }
  .service-row:last-child { border-bottom: none; }
  .service-row input { width: auto; }

  .success-box { text-align: center; padding: 20px 0; }
  .success-box .check {
    width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 22px; margin: 0 auto 14px;
  }
  .success-box a { color: var(--accent); font-weight: 600; word-break: break-all; }

  table.history { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.history th { text-align: left; color: var(--text-dim); font-weight: 600; font-size: 10.5px;
    text-transform: uppercase; letter-spacing: 0.04em; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  table.history td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.history a { color: var(--accent); font-weight: 600; text-decoration: none; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10.5px; font-weight: 600; }
  .pill-generated { background: #E6F6F1; color: var(--accent-dark); }
  .pill-error { background: var(--danger-bg); color: var(--danger); }
  .pill-draft { background: #EEF0F3; color: var(--text-dim); }

  .empty-state { text-align: center; color: var(--text-dim); padding: 40px 10px; font-size: 12.5px; }
</style>
